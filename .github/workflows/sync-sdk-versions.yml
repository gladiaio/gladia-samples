name: Sync Gladia SDK versions

on:
  schedule:
    # Daily at 06:30 UTC (aligned with gladiaio/skills documentation sync)
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch latest versions
        id: versions
        run: |
          JS_VERSION=$(curl -sf https://registry.npmjs.org/@gladiaio/sdk/latest | jq -r '.version')
          PY_VERSION=$(curl -sf https://pypi.org/pypi/gladiaio-sdk/json | jq -r '.info.version')
          echo "js=$JS_VERSION" >> "$GITHUB_OUTPUT"
          echo "py=$PY_VERSION" >> "$GITHUB_OUTPUT"

      - name: Read current versions
        id: current
        run: |
          CURRENT_PY=$(grep -oE 'gladiaio-sdk==[0-9]+\.[0-9]+\.[0-9]+' python/pyproject.toml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          CURRENT_JS=$(jq -r '.packages["node_modules/@gladiaio/sdk"].version' javascript/package-lock.json)
          echo "js=$CURRENT_JS" >> "$GITHUB_OUTPUT"
          echo "py=$CURRENT_PY" >> "$GITHUB_OUTPUT"

      - name: Check for updates
        id: check
        run: |
          if [ "${{ steps.versions.outputs.js }}" = "${{ steps.current.outputs.js }}" ] && \
             [ "${{ steps.versions.outputs.py }}" = "${{ steps.current.outputs.py }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Samples already on latest SDK (JS ${{ steps.current.outputs.js }}, Python ${{ steps.current.outputs.py }})"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Update needed: JS ${{ steps.current.outputs.js }} → ${{ steps.versions.outputs.js }}, Python ${{ steps.current.outputs.py }} → ${{ steps.versions.outputs.py }}"
          fi

      - uses: astral-sh/setup-uv@v7
        if: steps.check.outputs.changed == 'true'
        with:
          version: "latest"

      - uses: actions/setup-node@v7
        if: steps.check.outputs.changed == 'true'
        with:
          node-version: "20"

      - name: Update Python samples
        if: steps.check.outputs.changed == 'true'
        working-directory: python
        run: |
          sed -i "s/gladiaio-sdk==[0-9.]*/gladiaio-sdk==${{ steps.versions.outputs.py }}/" pyproject.toml
          uv lock

      - name: Update JavaScript samples
        if: steps.check.outputs.changed == 'true'
        working-directory: javascript
        run: npm install "@gladiaio/sdk@${{ steps.versions.outputs.js }}"

      - name: Update TypeScript samples
        if: steps.check.outputs.changed == 'true'
        working-directory: typescript
        run: npm install "@gladiaio/sdk@${{ steps.versions.outputs.js }}"

      - name: Create pull request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): bump Gladia SDK (JS ${{ steps.versions.outputs.js }}, Python ${{ steps.versions.outputs.py }})"
          branch: auto/sync-gladia-sdk-samples
          delete-branch: true
          title: "chore(deps): bump Gladia SDK (JS ${{ steps.versions.outputs.js }}, Python ${{ steps.versions.outputs.py }})"
          body: |
            Automated bump of Gladia SDK dependencies in the sample projects.

            | Stack | Package | Previous | New |
            | --- | --- | --- | --- |
            | JavaScript | `@gladiaio/sdk` | `${{ steps.current.outputs.js }}` | `${{ steps.versions.outputs.js }}` |
            | TypeScript | `@gladiaio/sdk` | `${{ steps.current.outputs.js }}` | `${{ steps.versions.outputs.js }}` |
            | Python | `gladiaio-sdk` | `${{ steps.current.outputs.py }}` | `${{ steps.versions.outputs.py }}` |

            Files updated: `python/pyproject.toml`, `python/uv.lock`, `javascript/package.json`, `javascript/package-lock.json`, `typescript/package.json`, `typescript/package-lock.json`.

            This PR was auto-generated by the [sync-sdk-versions workflow](.github/workflows/sync-sdk-versions.yml).
          labels: |
            automated
            dependencies
